# ingest daemon configuration (see INGEST_PLAN.md / ARCHITECTURE.md).
#
# Every value has a built-in default (see DEFAULTS in ingest_config.py); omit
# anything to keep the default. CLI flags (--vid, --dest, --hub-prefix, ...)
# override.

[hub]
# Readers = the drives plugged into this USB hub, matched by the hub's vid:pid
# (find it with `lsusb`). Picks up SD readers AND an SSD on the hub; the internal
# nvme and the display board are never matched. Set path_prefix instead (a
# /dev/disk/by-path prefix) if you'd rather pin one exact physical port.
vid = "1a40"                   # Terminus Technology hub
pid = "0101"
path_prefix = ""

[dest]
base = "/media/jetson1/jetson_backup/ingest/"   # files land in base/<uuid>/<date>/

[hash]
algo = "sha1"                  # common hash across Google Drive + Backblaze B2
                               # (so the remote can be verified from metadata,
                               # no download). rclone hash name; upper-cased.

[segments]
# Okabe-Ito, colourblind-safe. The four pipeline stages the bar climbs through.
uncopied = "#E69F00"           # orange - still only on the card
copied   = "#F0E442"           # yellow - copied to local disk, not verified
verified = "#0072B2"           # blue   - hash-verified local copy
uploaded = "#009E73"           # green  - pushed to the cloud remote
empty    = "#202020"           # bg / free space
numbers  = true                # per-segment GB numbers on the bars

[poll]
interval_ms = 500              # discovery + display tick; also the hb period

[wipe]
# SAFETY: with false (the default), a confirmed wipe only *logs* what it would
# delete. Set true to actually erase cards after a confirm. That's the only
# switch -- the ingest daemon logs "wipe ARMED" loudly at startup when it's on.
enabled = false

[remote]
# Where the (separate) uploader pushes verified ingests, as an rclone
# destination prefix. Empty = no uploading. The remote + credentials live in
# rclone's own config (`rclone config`); only the path prefix goes here.
#   base = "b2:my-bucket/ingest"      # Backblaze B2
#   base = "gdrive:ingest"            # Google Drive
#   base = "/mnt/backup2/ingest"      # a second local disk
base = ""

[backup]
# Plain directories mirrored to the same [remote] base, beside the SD-card
# pipeline. Nothing here involves a card, the display, or wiping: each entry is
# rclone-copied and then verified against the remote's own hashes, and NOTHING
# is written back into src (a card ingest gets uploaded.json; these do not,
# because another application owns the directory).
#
# dst is relative to [remote] base. copy, never sync -- the remote holds cards
# that were wiped locally long ago, and a sync would delete them.
#
#   paths = [
#     { src = "/media/jetson1/nvme/immich/library/library", dst = "immich/library" },
#     { src = "/media/jetson1/nvme/immich/library/backups", dst = "immich/backups" },
#   ]
paths        = []      # empty = no plain-path backups
interval     = 300     # seconds between copy passes. Cheap -- a copy that finds
                       # nothing new is just a listing diff -- so this can be
                       # short; it sets how quickly new data reaches the remote.
verify_every = 86400   # seconds between full hash scrubs. The check re-reads
                       # every byte of src, so it is the half worth throttling.
                       # A copy that moved bytes is always checked immediately,
                       # whatever this says. 0 = re-hash on every pass.

[web]
# The station's display: one page, static HTML + CSS, no JavaScript. It is also
# the confirm channel -- the button that authorises a wipe is a form POST, which
# carries the card's uuid so a stale page cannot confirm a card that has since
# been swapped into the same slot.
#
# Anyone who can reach this address can confirm a wipe, so keep it off the
# public internet. "" disables the server entirely (stdin confirms only).
addr = ":8081"       # distinct from [http] addr below, which is rclone's browser

[http]
# The rclone-http service serves a read-only web listing (browse + download).
# With target empty (the default) it AUTO-serves both the local [dest] base and
# the cloud [remote] base in one view (local/ + cloud/) when a remote is set,
# else just the local dest. Set target to override with a specific path/remote.
target = ""
addr   = ":8080"    # http://<box>:8080 ; keep it on your LAN, not the internet
